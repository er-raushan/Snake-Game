<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section>
        <div class="infos">
            <div class="info">
              <h3>High Score : <span class="highscore"></span></h3>
            </div>
            <div class="info">
              <h3>Score : <span class="score"></span></h3>
            </div>
            <div class="info">
              <h3>Time : <span class="tiktik_timer">00-00</span></h3>
            </div>
        </div>
        <div class="modal">
          <div class="stm">Game Over</div>
          <div class="buttonparent">
            <button class="startbtn">START</button>
            <button class="restartbtn">RESTART</button>
          </div></div>
        <div class="board">

            

          
        </div>
        
      </section>
      
    </main>
